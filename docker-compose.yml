# Xanderia Council — full stack.
#   cp .env.example .env   (then edit secrets)
#   docker compose up -d --build
# Ollama runs on the GPU server (aixan) by default; see OLLAMA_BASE_URL in .env.
# To run Ollama inside this stack instead (GPU host with nvidia-container-toolkit):
#   docker compose --profile ollama up -d   and set OLLAMA_BASE_URL=http://ollama:11434

name: xanderia-council

x-app: &app
  build:
    context: .
    dockerfile: server/Dockerfile
  image: xanderia-council-server
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-council}:${POSTGRES_PASSWORD:-council}@postgres:5432/${POSTGRES_DB:-council}
    REDIS_URL: redis://redis:6379
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-council}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-council}
      POSTGRES_DB: ${POSTGRES_DB:-council}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"   # host access for dev/tests only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddydata:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Ollama inside the stack (GPU host). Mirrors HANDOFF §5.2 settings.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  ollama:
